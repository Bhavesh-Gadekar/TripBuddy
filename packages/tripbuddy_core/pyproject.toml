[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tripbuddy_core"
version = "0.1.0"
description = "Shared core logic, database models, schemas, and configurations for TripBuddy"
authors = [{ name = "TripBuddy Authors" }]
dependencies = [
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tripbuddy_core*"]

